<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyTodo</title>
  </head>
  <body>
    <div class="main-parent-container">
      <div class="main-title">
        <span class="title-span">TODO`s</span>
        <input type="text" id="title-input" />
        <div class="add-button-container">
          <button id="title-btn">
            <span class="span-sign">+</span>
          </button>
          <!-- <button id="note-btn">
            <span class="span-sign">Add notes</span>
          </button> -->
        </div>
      </div>
      <div class="input-container">
        <div class="todo-section">
          <!-- <div class="input-tile-container"></div> -->
          <div class="desc-container">
            <label for="desc" class="label-content"
              >Description<span class="colon-span">:</span></label
            >
            <div class="todo-desc">
              <textarea
                id="description"
                placeholder="description"
                cols="50"
                rows="2"
              ></textarea>
            </div>
          </div>
        </div>
      </div>

      <div class="container">
        <div class="list-container"></div>
      </div>
    </div>
  </body>
</html>
